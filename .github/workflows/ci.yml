name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: ${{ matrix.name }}
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            executable: src-tauri/target/release/xiaoli.exe
          - name: macOS native
            os: macos-14
            executable: src-tauri/target/release/xiaoli
          - name: Linux x64
            os: ubuntu-22.04
            executable: src-tauri/target/release/xiaoli
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget zip

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Remap private Rust build paths
        run: node scripts/release/prepare-rust-path-remap.mjs

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          rustup default 1.89.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate plugin package
        run: node scripts/release/validate-plugin.mjs plugin/xiaoli-model-monitor

      - name: Validate public tree and release gates
        run: |
          node scripts/release/verify-version.mjs 0.2.0-beta.1
          node scripts/release/scan-public-tree.mjs
          node --test scripts/release/tests/release-gates.test.mjs

      - name: Type-check frontend
        run: pnpm check

      - name: Test frontend behavior
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Format-check Rust
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-targets --all-features

      - name: Build native portable executable
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        with:
          args: --no-bundle

      - name: Scan native executable for private build paths
        run: node scripts/release/assert-no-private-build-paths.mjs "${{ matrix.executable }}"

      - name: Smoke-test portable executable
        shell: pwsh
        run: >-
          ./scripts/release/Test-Portable.ps1
          -Executable "${{ matrix.executable }}"
          -ScratchRoot "${{ runner.temp }}/xiaoli-smoke"
